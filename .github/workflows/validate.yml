name: Validate Memento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Install pre-commit hook for audit parity
        run: bash scripts/install-hooks.sh

      - name: Lint knowledge base
        run: bash scripts/lint-knowledge-base.sh

      - name: Audit Agent usability
        run: python3 scripts/audit-agent-usability.py

      - name: Self check
        run: bash scripts/self-check.sh
